aid: amca
name: Amca
description: Amca (Advanced Manufacturing Company of America) is an El Segundo, California aerospace
  and defense manufacturer rebuilding America's industrial base by acquiring specialized component
  suppliers and expanding competition and capacity for critical parts — actuators, switches, hydraulics,
  pressure sensors, power electronics, and flight-control electronics. Founded in 2024 by Eli Giovanetti
  and Jai Malik, Amca combines design, testing, and production into a single RAPID platform across a
  network of AS9100D-certified factories (Electro-Mech Components, Electrocube, Aerospace Control
  Products, Payne Magnetics, Cal-Draulics, BC Power Systems), and serves nearly every major aerospace
  and defense prime and Tier 1 supplier — Boeing, Lockheed Martin, Airbus, GE Aerospace, Honeywell,
  Textron, BAE Systems, and the Defense Logistics Agency. It is a hardware manufacturing company with
  no public developer API surface.
